name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
          firewall-version: '1.15.4'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: sfw pip install ".[test]"
      - name: Run all tests
        run: PYTHONPATH=src python -m pytest -q
      - name: Compile source and tests
        run: python -m compileall -q src tests

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: socketdev/action@ba6de6cc0565af1f42295590380973573297e31f
        with:
          mode: firewall-free
          firewall-version: '1.15.4'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          sfw pip install build==1.6.1 setuptools wheel
          python -m build --no-isolation
      - name: Scan complete distributions
        run: PYTHONPATH=src python -m push_guard scan-package --repo . dist/*

  release-gate:
    name: Release PR gate
    if: github.event_name == 'pull_request' && always()
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require every test and package scan
        env:
          TEST_RESULT: ${{ needs.test.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: test "$TEST_RESULT" = success && test "$PACKAGE_RESULT" = success
